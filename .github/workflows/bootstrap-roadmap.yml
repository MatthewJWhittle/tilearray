# One-shot: assign milestones/labels to roadmap issues (cursor[bot] cannot PATCH issues).
# Removed from the branch after it succeeds; do not merge this file to main.
name: Bootstrap roadmap structure

on:
  push:
    branches: [cursor/docs-roadmap-7d9a]
    paths:
      - .github/workflows/bootstrap-roadmap.yml

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign milestones and labels to roadmap issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const milestones = await github.paginate(
              github.rest.issues.listMilestones,
              { owner, repo, state: 'open', per_page: 100 },
            );
            const ms = Object.fromEntries(milestones.map((m) => [m.title, m.number]));
            core.info(`Milestones: ${JSON.stringify(ms)}`);

            const assignments = [
              { number: 53, milestone: '0.2 Trustworthy core', labels: ['roadmap', '0.2', 'deps'] },
              { number: 54, milestone: '0.2 Trustworthy core', labels: ['roadmap', '0.2', 'api'] },
              { number: 55, milestone: '0.2 Trustworthy core', labels: ['roadmap', '0.2', 'documentation'] },
              { number: 56, milestone: '0.2 Trustworthy core', labels: ['roadmap', '0.2', 'fetch'] },
              { number: 57, milestone: '0.2 Trustworthy core', labels: ['roadmap', '0.2', 'fetch'] },
              { number: 58, milestone: '0.3 Scale & hosts', labels: ['roadmap', '0.3'] },
              { number: 59, milestone: '0.3 Scale & hosts', labels: ['roadmap', '0.3', 'fetch'] },
              { number: 60, milestone: '0.3 Scale & hosts', labels: ['roadmap', '0.3', 'documentation'] },
              { number: 61, milestone: '0.3 Scale & hosts', labels: ['roadmap', '0.3', 'api'] },
              { number: 62, milestone: '1.0 Stable contract', labels: ['roadmap', '1.0', 'api'] },
            ];

            for (const a of assignments) {
              const milestone_number = ms[a.milestone];
              if (!milestone_number) {
                core.setFailed(`Missing milestone: ${a.milestone}`);
                return;
              }
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: a.number,
                milestone: milestone_number,
                labels: a.labels,
              });
              core.info(`Updated #${a.number} → ${a.milestone} [${a.labels.join(', ')}]`);
            }
