name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Build package
      run: |
        uv build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    # Generate PEP 740 publish attestations for dist/* before uv publish.
    # uv uploads matching *.publish.attestation files but does not create them.
    - name: Generate PEP 740 attestations
      uses: astral-sh/attest-action@v0.0.7

    - name: Publish to PyPI
      env:
        # May be empty when the secret is unset — an empty UV_PUBLISH_TOKEN
        # in the environment makes uv attempt token auth and skip OIDC.
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -n "${UV_PUBLISH_TOKEN}" ]; then
          uv publish --token "${UV_PUBLISH_TOKEN}"
        else
          # Trusted Publishing (OIDC) when PYPI_API_TOKEN is unset
          unset UV_PUBLISH_TOKEN
          uv publish --trusted-publishing always
        fi
