name: Nightly

on:
  schedule:
    # 05:17 UTC daily
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  net-slow:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Offline docs-journey smoke
      run: |
        uv run python scripts/docs_journey_smoke.py

    - name: Run net/slow tests
      run: |
        uv run pytest -m "net or slow" --timeout=300 --cov-fail-under=0
