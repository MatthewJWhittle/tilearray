[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tilearray"
dynamic = ["version"]
description = "A Python library for loading geospatial data from remote tile servers as xarray objects"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Matthew Whittle", email = "47574804+MatthewJWhittle@users.noreply.github.com"},
]
keywords = [
    "geospatial",
    "gis",
    "xarray",
    "ogc",
    "wcs",
    "wms",
    "wmts",
    "xyz",
    "tiles",
    "dask",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "eval-type-backport>=0.2.0; python_version < '3.10'",
    "dask>=2024.8.0",
    "httpx>=0.28.1",
    "numpy>=2.0.2",
    "pillow>=11.3.0",
    "pydantic>=2.12.3",
    "pyproj>=3.6.1",
    "tenacity>=9.0.0",
    "tifffile>=2024.8.30",
    "xarray>=2024.7.0",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
# Mirrors [dependency-groups].dev so `pip install 'tilearray[dev]'` matches `uv sync --dev`.
dev = [
    "coverage>=7.10.7",
    "hypothesis>=6.141.1",
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=7.0.0",
    "pytest-httpserver>=1.1.3",
    "pytest-timeout>=2.4.0",
    "pytest-vcr>=1.0.2",
    # Pin past pytest-vcr's 4.3.0 resolution on 3.9 — that build's httpx stubs
    # fail cassette replay (`content` is None). vcrpy 7 supports 3.9.
    "vcrpy>=7.0.0",
    # Direct: scripts/check_cassettes.py (packaging CI) — also transitive via vcrpy.
    "pyyaml>=6.0.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.22.0",
    "ruff>=0.1.0",
    # Stubs only needed where CI mypy runs (3.11+). On 3.9, types-tqdm pulls
    # types-requests → urllib3 2.x, which breaks pytest-vcr / vcrpy.
    "types-tqdm>=4.67.3.20260205; python_version >= '3.10'",
    "zarr>=2.18.0,<3",
]
docs = [
    "sphinx>=6.0.0",
    "pydata-sphinx-theme>=0.15.0",
    "myst-parser>=3.0.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-design>=0.5.0",
    "matplotlib>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/MatthewJWhittle/tilearray"
Repository = "https://github.com/MatthewJWhittle/tilearray"
Documentation = "https://matthewjwhittle.github.io/tilearray/"
"Bug Tracker" = "https://github.com/MatthewJWhittle/tilearray/issues"

[tool.hatch.version]
path = "src/tilearray/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tilearray"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/uv.lock",
    "/benchmarks",
    "/scripts",
    "/notebooks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not slow and not net",
    "--timeout=60",
    "--maxfail=5",
    "--cov=src/tilearray",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=85",
    "-n",
    "auto",
    "--dist=loadfile",
    "--basetemp=/tmp/tilearray_test",
]
markers = [
    "unit: marks tests as unit tests (fast, pure logic)",
    "contract: marks tests as contract tests (VCR-backed)",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (>1s)",
    "net: marks tests requiring network",
    "soak: multi-tile politeness soak / bench (also mark net/slow; PR-deselected)",
    "property: marks tests as property-based tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:pydantic.*",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["tilearray"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "tilearray.array"
disable_error_code = ["unreachable", "assignment"]

[[tool.mypy.overrides]]
module = "tilearray.decode"
disable_error_code = ["unreachable", "assignment", "redundant-cast"]

[[tool.mypy.overrides]]
module = [
    "httpx",
    "httpx.*",
    "tenacity",
    "tenacity.*",
    "tifffile",
    "tifffile.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/tilearray"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "coverage>=7.10.7",
    "hypothesis>=6.141.1",
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=7.0.0",
    "pytest-httpserver>=1.1.3",
    "pytest-timeout>=2.4.0",
    "pytest-vcr>=1.0.2",
    "vcrpy>=7.0.0",
    # Direct: scripts/check_cassettes.py (packaging CI) — also transitive via vcrpy.
    "pyyaml>=6.0.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.22.0",
    "ruff>=0.1.0",
    "types-tqdm>=4.67.3.20260205; python_version >= '3.10'",
    "zarr>=2.18.0,<3",
]
